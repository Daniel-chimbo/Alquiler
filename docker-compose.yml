services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle-alquileres
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle123        # password de SYS y SYSTEM
      APP_USER: ALQUILERESDB            # crea este usuario en FREEPDB1
      APP_USER_PASSWORD: alquileres123
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  oracle-data:
